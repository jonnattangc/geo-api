services:
  geo-api:
    container_name: geo-api
    build:
      context: .
      dockerfile: Dockerfile
    image: geoapi:local
    restart: unless-stopped
    ports:
      - "${PORT:-8075}:${PORT:-8075}"
    environment:
      - PORT=${PORT:-8075}
      - GEO_API_KEY=${GEO_API_KEY:?GEO_API_KEY is required}
      # Opcional: carga shapes desde S3 en vez de disco local.
      # - USE_AWS_SHAPES=true
      # - AWS_S3_BUCKET=mi-bucket
      # - AWS_S3_PREFIX=shapes/chile
      # - AWS_ACCESS_KEY_ID=...
      # - AWS_SECRET_ACCESS_KEY=...
      # - AWS_DEFAULT_REGION=us-east-1
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:${PORT:-8075}/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - geo-net

networks:
  geo-net:
    driver: bridge
