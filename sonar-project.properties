# Configuracion basica de SonarCloud/SonarQube para geo-api
# Reemplaza los valores de sonar.projectKey y sonar.organization por los tuyos.

sonar.projectKey=jonnattangc_geo-api
sonar.organization=jonnattangc

sonar.projectName=geo-api
sonar.projectVersion=1.0

# Ruta relativa al directorio de trabajo de Sonar (raiz del repo)
sonar.sources=app

# Excluir dependencias, cache y archivos estaticos
sonar.exclusions=app/static/**/*,app/**/__pycache__/**/*

# Lenguaje principal
sonar.language=py

# Encoding
sonar.sourceEncoding=UTF-8
